a bank account", "المدينة اللي قبل": "Previous city", "المدينة اللي بعد": "Next city", "مربع للبناء · سكان أكتر": "tiles to build on · more residents", "محتاج فلوس في الحساب الفعّال": "Needs money in the active account", "القطعة الأكبر فيها مربعات أكتر تبني عليها وسكان أكتر، بس سعرها أغلى. وكل قطعة جديدة في نفس الدولة بتغلى عن اللي قبلها": "Bigger plots have more tiles to build on and more residents, but cost more. Each new plot in the same country costs more than the last", "دي القطعة رقم": "this is plot #", "قطعة أرض جديدة في": "New plot in", "بيزيدوا لحد سعة السكن، والسعة بتكبر بمباني الإسكان.": "grow up to housing capacity; housing buildings raise capacity.", "القوة العاملة": "Workforce", "من السكان، ودول اللي بيشتغلوا في مبانيك وفي الشركات.": "of residents — they staff your buildings and the companies.", "العاطلين": "Unemployed", "بيصرفوا أقل والسكان بيقلّوا لو كتروا.": "spend less, and population shrinks if there are too many.", "الوظايف الفاضية": "Vacant jobs", "بتقلل كفاءة مبانيك.": "lower your buildings' efficiency.", "لو العمال أقل من الوظايف، كل المباني بتنتج أقل.": "if workers are fewer than jobs, every building produces less.", "التنقّل": "Commuting", "العاطلين في مدينة بيروحوا يشتغلوا في مدينة تانية جوّه نفس الدولة لوحدهم.": "unemployed people in one city automatically commute to jobs in another city of the same country.", "بيعلى لما احتياجات السكان (أكل، لبس، علاج…) تتغطى من مبانيك أو التجارة، وبيرفع دخل المحلات.": "rises when residents' needs (food, clothes, medicine…) are covered by your buildings or trade, and it boosts shop income.", "شركات منافسة شغالة في المدينة. كل منافس في نفس قطاع مبانيك بيقلل دخلها 12%. لو استحوذت على شركة بتبطّل تنافسك وبتاخد أرباحها كل دقيقة.": "Competing companies in the city. Each competitor in the same sector as your buildings cuts their income by 12%. Acquire one and it stops competing and pays you its profits every minute.", "هنا بتبيع وتشتري بضاعة: مع مدن الكمبيوتر (خطوط تجارة وعقود)، أو استيراد وتصدير لأي دولة أو لمدنك انت، أو مع اللاعيبة الحقيقيين. البضاعة اللي بتستوردها بتشغّل مصانعك أرخص وبتغطي احتياجات سكانك.": "Buy and sell goods here: with computer cities (trade routes and contracts), import/export with any country or between your own cities, or with real players. Imported goods run your factories cheaper and cover residents' needs.", "خط بين مدينتين ليك أو مع مدينة تانية بيزود الدخل كل دقيقة على حسب المسافة ووسيلة النقل، وليه تكلفة تشغيل.": "A route between two of your cities or with another city adds income every minute based on distance and transport, with a running cost.", "مدن بيديرها الكمبيوتر وليها احتياجات. لو قبلت عقد وغطّيت احتياجاتهم سمعتك بتعلى وبيدفعوا أكتر.": "Computer-run cities with needs. Accept a contract and cover their needs to raise your reputation and get paid more.", "استيراد وتصدير": "Import & export", "بتشتري بضاعة كل دقيقة لمدينة، فمصانعها تشتغل بخامات أرخص (25% بس من تمنها) وسكانها ياخدوا احتياجاتهم.": "buys goods every minute for a city, so its factories run on cheaper inputs (only 25% of their cost) and residents get what they need.", "بتبيع من إنتاج مدينتك لدولة تانية أو لمدينة تانية ليك. الشحن بيتحسب على حسب المسافة.": "sells your city's output to another country or to another of your cities. Shipping depends on distance.", "البضايع اللي سكان كل مدينة محتاجينها. لو اتغطّت (من إنتاجك أو استيراد) الرضا بيعلى والمحلات بتكسب أكتر.": "Goods each city's residents need. Cover them (by producing or importing) to raise happiness and shop income.", "التجارة مع اللاعيبة": "Trading with players", "بتنشر عرض بيع أو طلب شرا لأي بضاعة. لما لاعب تاني يقبله، البضاعة بتتشحن كل دقيقة من إنتاج البايع لحد ما المدة تخلص، والفلوس بتتحسب على قد اللي اتسلّم. تقدر كمان تبعت عرض خاص لصاحبك بس، وبسعر 0 يبقى هدية.": "Post a sell offer or buy request for any good. When another player accepts, goods ship every minute from the seller's output until the term ends, and payment matches what was delivered. You can also send a private offer to a friend — at price 0 it's a gift.", "العقود اللي اتقفلت مع لاعيبة حقيقيين. الشريط بيبيّن فاضل قد إيه، والأرقام بتبيّن اتسلّم كام واتدفع كام.": "Contracts closed with real players. The bar shows time left; the numbers show what was delivered and paid.", "البلوبرنت هو الرخصة اللي بتفتح قطاع كامل من المباني (زراعة، صناعة، تكنولوجيا…). من غيره مش هتقدر تبني مباني القطاع ده ولا تستحوذ على شركاته.": "A blueprint is the licence that unlocks a whole sector of buildings (farming, industry, tech…). Without it you can't build that sector or acquire its companies.", "ترتيب كل اللاعيبة. الدرجة بتتحسب من صافي ثروتك والسكان ومستويات مبانيك وعدد الدول والخطوط والشركات والبلوبرنت. دوس على أي لاعب تشوف ملفه وتضيفه صديق.": "All players ranked. Score comes from net worth, population, building levels, countries, routes, companies and blueprints. Tap any player to see their profile and add them as a friend.", "رسايلك بيشوفها كل اللاعيبة.": "every player sees your messages.", "ضيف صديق بكود حسابه أو من اسمه، وابعتله فلوس أو بضاعة.": "add a friend by account code or name, then send money or goods.", "اكتب كود حساب أي لاعب وحوّله. الرسوم 1% + الصرافة.": "enter any player's account code and send. Fee 1% + exchange.", "قرض من بنك الدولة بعملتها. القسط بيتخصم كل دقيقة من حسابك هناك. الفايدة على حسب درجتك الائتمانية، ولو اتأخرت 3 أقساط البنك بياخد أرض.": "A loan from the country's bank in its currency. Installments are taken every minute from your account there. Interest depends on your credit score; miss 3 installments and the bank takes land.", "التحويل بين حساباتك": "Moving money between your accounts", "كل دولة ليها حساب بعملتها. التحويل بينهم عليه 0.5% + رسوم صرافة البنكين.": "Each country has an account in its currency. Transfers between them cost 0.5% + both banks' exchange fees.", "الحساب الفعّال": "The active account", "هو اللي بتتدفع منه المصاريف العامة زي البلوبرنت والكروت والدهب.": "pays general costs like blueprints, cards and gold.", "أكواد الحسابات": "Account codes", "كل حساب بنكي ليه كود خاص باسمك (زي EG-7KQ2MX). ابعته لأي لاعب يحوّلك عليه، أو اكتب كوده عشان تحوّله انت.": "Every bank account has its own code under your name (like EG-7KQ2MX). Share it so a player can pay you, or enter theirs to pay them.", "الدخل في كل دولة بيتحصّل في حسابها المحلي، والبناء هناك بيتدفع منه. لو مفيش حساب، الدخل بيتحجز لحد ما تفتح واحد.": "Income in each country is collected into its local account, and building there is paid from it. Without an account, income is held until you open one.", "قيمة كل عملة قصاد الدولار بتتغير طول الوقت. لو العملة ضعفت، الفلوس اللي في حسابك هناك بتقل قيمتها بالدولار.": "Each currency's value against the dollar keeps moving. If it weakens, your money there is worth fewer dollars.", "الدهب بيحافظ على قيمة فلوسك وبيطلع في الأزمات. الشرا والبيع عليهم فرق 1.2%، والتخزين ليه تكلفة صغيرة.": "Gold protects your money's value and rises in crises. Buying and selling carry a 1.2% spread, and storage has a small cost.", "أسهم وعملات رقمية أسعارها بتطلع وتنزل. اشتري رخيص وبيع غالي، وخلي بالك: الكريبتو حركته أعنف.": "Stocks and crypto prices go up and down. Buy low, sell high — crypto swings harder.", "لما تأسس بنك، بتحدد فايدة الإيداع والقرض. الناس بتودّع وبتقترض على حسب أسعارك، وانت بتكسب الفرق.": "When you found a bank you set deposit and loan rates. People deposit and borrow based on your rates, and you earn the spread.", "كل شوية بتسحب كارت جديد: مضاعفة الدخل، مدير يحصّل لوحده، خصم على الأرض… استخدمه في الوقت الصح.": "Every so often you draw a new card: double income, an auto-collect manager, land discounts… use it at the right moment.", "قايمة البناء": "Build menu", "اختار القطاع من فوق، وبعدين المبنى.": "Pick a sector at the top, then a building.", "بتوريك كل معلوماته: بيطلّع إيه، محتاج خامات إيه، الدخل، والوظايف.": "shows everything about it: outputs, required inputs, income and jobs.", "الأيقونات الصغيرة فوق الكارت: الخامات ➜ الإنتاج. الأخضر يعني الخامة موجودة عندك، والأصفر مستوردة أو في مدينة تانية، والأحمر مش موجودة.": "Small icons on the card: inputs ➜ output. Green means you have the input, yellow means imported or in another city, red means missing.", "عندك": "You have", "يعني المبنى ده موجود في المدينة دي، والرقم عدده.": "means this building already exists in this city; the number is how many.", "مخزون المدينة": "City stock", "البضايع اللي مدينتك بتنتجها كل دقيقة. تقدر تصدّرها لدولة تانية أو لمدينة تانية ليك.": "Goods your city produces every minute. You can export them to another country or another of your cities.", "خامات ناقصة": "Missing inputs", "مصانعك محتاجة الخامات دي ومش بتتنتج في المدينة. استوردها عشان المصنع يشتغل أرخص ويكسب أكتر.": "Your factories need these inputs and the city doesn't produce them. Import them so factories run cheaper and earn more.", "كل ما صافي ثروتك يعدّي رقم معين بتاخد لقب جديد بيظهر في ملفك وفي المنافسة.": "Each time your net worth passes a milestone you earn a new title shown on your profile and the leaderboard.", "في كل دولة بتشتغل فيها ليك شركة باسم مختلف. الشركة دي اللي بتملك المباني والحسابات هناك.": "In each country you operate you have a company with its own name. It owns the buildings and accounts there.", "الحفظ": "Saving", "اللعبة بتتحفظ لوحدها على الجهاز. لو داخل بحسابك بتتحفظ كمان أونلاين وتفتحها من أي جهاز.": "The game saves on this device automatically. When signed in it also saves online so you can open it on any device.", "كل فلوس دخلت أو خرجت من الحساب ده: دخل، بناء، تحويلات، أقساط.": "Every bit of money in or out of this account: income, building, transfers, installments.", "كل بنك ليه فايدة توفير ورسوم وقروض مختلفة. تقدر تنقل حسابك لبنك أحسن.": "Each bank has different savings rates, fees and loans. You can move your account to a better bank.", "شاشة المدينة": "The city screen", "المربعات": "Tiles", "كل مربع نوع أرض (زراعية، صحرا، جبل، ساحل، حضرية) وكل مبنى ليه أرض تناسبه. دوس على مربع فاضي تبني عليه، أو على مبنى تحصّل وتطوّر.": "each tile is a terrain type (farmland, desert, mountain, coast, urban) and each building needs suitable terrain. Tap an empty tile to build, function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function countryInfo(p){
  const a=p.a,pop=POP[a]??Math.max(.3,Math.min(15,p.km/90000)),w=RICH.has(a)?1.6:MID.has(a)?1.15:.85;
  const r=rng(hash(a+'m'));
  const mins=new Set(['salt','sand','clay','limestone']);for(const m in MINERALS)if(MINERALS[m].has(a))mins.add(m);
  if(mins.size<5){const pool=['coal','iron','zinc','nickel'];mins.add(pool[Math.floor(r()*4)]);if(r()<.5)mins.add(pool[Math.floor(r()*4)])}
  const price=a==='EG'?0:Math.round((3000+Math.sqrt(pop)*1500*w)/100)*100;
  return {a,n:LANG==='en'?enCountry(a,p.n):p.n,lat:p.lat,km:p.km,pop,wealth:w,demand:Math.max(.5,Math.min(2.4,(.6+Math.log10(pop+1)/4)*w)),mins,price,ll:LANDLOCKED.has(a)};
}
function genTiles(c,key,N=6){const NN=N*N,M=N-1,sc=NN/36;
  const r=rng(hash(key&&key!==c.a?key:c.a));const lat=Math.abs(c.lat);
  let w={urban:.2,fertile:.33,desert:.12,mountain:.15,coast:.2};
  if(DESERT.has(c.a)){w.desert=.42;w.fertile=.12}
  if(MOUNT.has(c.a)){w.mountain=.3;w.fertile-=.08}
  if(lat>55){w.mountain+=.1;w.fertile-=.08}
  if(lat<15){w.fertile+=.08;w.desert=Math.max(0,w.desert-.06)}
  if(c.ll){w.fertile+=w.coast/2;w.urban+=w.coast/2;w.coast=0}
  const cnt={};let tot=0;for(const k in w){cnt[k]=Math.max(0,Math.round(w[k]*NN));tot+=cnt[k]}
  cnt.fertile+=NN-tot;
  const fix=(k,m)=>{if(cnt[k]<m){const d=m-cnt[k];cnt[k]=m;const big=Object.keys(cnt).sort((x,y)=>cnt[y]-cnt[x])[0];cnt[big]-=d}};
  fix('urban',Math.round(4*sc));fix('fertile',Math.round(7*sc));if(!c.ll)fix('coast',Math.round(4*sc));
  const nz=()=>{const g=[...Array(NN)].map(()=>r());return g.map((v,i)=>{const x=i%N,y=(i/N)|0;let s=v,n=1;[[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{const X=x+dx,Y=y+dy;if(X>=0&&X<N&&Y>=0&&Y<N){s+=g[Y*N+X];n++}});return s/n})};
  const A=nz(),Bn=nz();const type=Array(NN).fill(null);
  const side=Math.floor(r()*4);
  const edgeD=i=>{const x=i%N,y=(i/N)|0;return [M-y,y,x,M-x][side]};
  const free=()=>[...Array(NN).keys()].filter(i=>!type[i]);
  free().sort((p,q)=>edgeD(p)-edgeD(q)+(A[p]-A[q])*.8).slice(0,cnt.coast).forEach(i=>type[i]='coast');
  free().sort((p,q)=>A[q]-A[p]).slice(0,cnt.mountain).forEach(i=>type[i]='mountain');
  free().sort((p,q)=>Bn[q]-Bn[p]).slice(0,cnt.desert).forEach(i=>type[i]='desert');
  const f5=M/5,cx=(side===2?4:side===3?1:2.5)*f5,cy=(side===0?3.5:side===1?1.5:2.5)*f5;
  const dist=i=>Math.hypot(i%N-cx,((i/N)|0)-cy);
  free().sort((p,q)=>dist(p)-dist(q)).slice(0,cnt.urban).forEach(i=>type[i]='urban');
  free().forEach(i=>type[i]='fertile');
  return type;
}

const WF={agri:7,animal:7,mining:16,food:15,light:18,heavy:24,tech:20,retail:7,transport:10,realestate:9,finance:8,gov:4};
function workersOf(b){if(b.grp==='house')return 0;const f=b.k==='shop'?WF.retail:(WF[b.s]||6);return Math.max(3,Math.round(f*Math.pow(b.cost/10000,.4)))}
const BD={};B.forEach(b=>{BD[b.id]=b;b.base=b.cost/(T*Math.pow(Math.max(1,b.cost/10000),.4));b.w=workersOf(b);
  const tier=b.cost<5000?'common':b.cost<50000?'rare':b.cost<300000?'epic':'legend';b.r=tier;
  if(b.k==='prod'){const o=val(b.out),i=val(b.inp);b.cps=b.cost/(T*Math.pow(Math.max(1,b.cost/10000),.4)*Math.max(o-i,o*.35))}
});

function catAvg(c){const l=CATS[c];return l.reduce((s,i)=>s+ITEMS[i].p,0)/l.length}
function val(m){let v=0;for(const k in m)v+=m[k]*(k[0]==='@'?catAvg(k.slice(1)):ITEMS[k].p);return v}

function fac2(o,lv){lot(o.lot||PAVE());const h=(o.h||.18)+.05*(lv-1),R=o.roof;let top=h+.02;
  if(o.yard)o.yard(lv);
  box(.1,.38,.68,.92,0,h,o.wall,{win:{fh:.12,cw:.16,glass:o.glassWin}});
  if(o.kind==='saw'){for(let j=0;j<4;j++){const v0=.38+j*.135;poly([IP(.1,v0,h),IP(.68,v0,h),IP(.68,v0+.135,h+.08),IP(.1,v0+.135,h+.08)],shade(R,.08),EDGE);poly([IP(.1,v0+.135,h+.08),IP(.68,v0+.135,h+.08),IP(.68,v0+.135,h),IP(.1,v0+.135,h)],COL.dark?'rgba(255,209,120,.85)':'#9cc2df',EDGE)}top=h+.08}
  else if(o.kind==='gable'){gable(.08,.36,.7,.94,h,.12,R);top=h+.12}
  else if(o.kind==='arch'){for(let j=0;j<6;j++){const a=Math.sin((j+.5)/6*Math.PI)*.1;poly([IP(.1,.38+j*.09,h+a),IP(.68,.38+j*.09,h+a),IP(.68,.47+j*.09,h+a),IP(.1,.47+j*.09,h+a)],shade(R,.15-j*.06),EDGE)}top=h+.1}
  else{box(.1,.38,.68,.92,h,.03,R);top=h+.03;if(o.band)box(.1,.38,.68,.92,h*.45,.03,o.band)}
  if(o.sign)box(.3,.92,.5,.94,h*.55,h*.3,o.sign);
  (o.tanks||[]).forEach((col,j)=>{cyl(.84,.48+j*.2,.065,0,.15+.03*(j%2),col);top=Math.max(top,.18)});
  for(let j=0;j<(o.silo||0);j++){cyl(.22+j*.17,.2,.07,0,.3+.04*lv,o.siloCol||'#d8d2c6');top=Math.max(top,.34+.04*lv)}
  for(let j=0;j<(o.chim||0);j++){const u=.6-j*.13,hh=.42+.05*lv+j*.05;cyl(u,.2,.035,0,hh,o.chimCol||'#8a6a5a');box(u-.03,.17,u+.03,.23,hh-.03,.03,'#c0392b');if(!j)iso.smoke=IP(u,.2,hh);top=Math.max(top,hh)}
  if(o.extra){const t=o.extra(h,lv);if(t)top=Math.max(top,t)}
  return top}

function estimate(code,b){
  const land=S.lands[code]||{tiles:[],pop:250,cos:genCos(code)};
  const M=RT.ctx[code]||countryMods(code,land);
  const outsHere=(RT.outsBy&&RT.outsBy[code])||new Set(),outsAll=RT.outsAll||new Set();
  const {r,loss}=rateOf(code,{t:b.tiles[0],b:{id:b.id,lv:1}},M,outsHere,outsAll);
  let block=blockOf(code,b);
  if(!block&&S.lands[code]&&!S.lands[code].tiles.some(x=>!x.b&&b.tiles.includes(x.t)))block=(TL("مفيش")+' ')+b.tiles.map(x=>TERR[x]).join((' '+TL("أو")+' '))+(' '+TL("فاضية في القطعة"));
  const cost=costOf(b),pm=block&&!block.startsWith(TL('مفيش')+' ')?0:r*compMul(M,b.s)*(M.hm||1)*svcMul(M,b)*60;
  return {cost,pm,pay:pm>0?cost/pm:Infinity,loss:loss&&r<=0,block,notes:modOf(code,b.tiles[0],b).notes,comp:M.comp[b.s]||0};
}

async function initAuth(){if(AUTH.tried)return;AUTH.tried=true;
  const T=setTimeout(()=>{if(!AUTH.ready){AUTH.ready=true;if(view==='login')renderView()}},10000);

async function packS(){const j=JSON.stringify(S);if(window.CompressionStream&&j.length>20000){try{const buf=new Uint8Array(await new Response(new Blob([j]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());let b='';for(let i=0;i<buf.length;i+=32768)b+=String.fromCharCode.apply(null,buf.subarray(i,i+32768));return {z:'gz',json:btoa(b)}}catch(e){}}return {z:'',json:j}}
async function unpackS(d){if(d.z==='gz'){const bin=Uint8Array.from(atob(d.json),c=>c.charCodeAt(0));return await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}return d.json}
async function syncCloud(){if(!AUTH.db||!AUTH.id)return;
  try{const snap=await AUTH.db.doc(saveP()).get();if(!snap.exists)return;const d=snap.data();if(!d||typeof d.json!=='string')return;
    if((d.at||0)>(S.last||0)+3000||(!S.started&&d.started)){const o=norm(JSON.parse(await unpackS(d)));if(o){boot(o);toast((TL("اتحمّل تقدّمك من حسابك")+' ☁️'))}}}catch(e){}}
function cloudTick(force){if(LOGGED!=='claude'||!AUTH.db||!AUTH.id||!S||AUTH.ro)return;const now=Date.now();
  if(S.started&&!AUTH.busyS&&(force||now-AUTH.cloudAt>45000)){AUTH.cloudAt=now;AUTH.busyS=1;
    packS().then(pk=>{if(pk.json.length>=240000){AUTH.busyS=0;if(!AUTH.bigW){AUTH.bigW=1;toast(('⚠️ '+TL("الحفظ كبير جدًا على السحابة — بيتحفظ على الجهاز بس")))}return}return AUTH.db.doc(saveP()).set({at:now,t:Math.round(S.t),started:true,...pk}).catch(e=>{if(e&&e.code==='invalid_argument')AUTH.ro=true}).finally(()=>AUTH.busyS=0)}).catch(()=>AUTH.busyS=0)}
  if(S.started&&!AUTH.busyL&&(force||now-AUTH.lbAt>60000)){const st=myStats(),sig=JSON.stringify(st);if(sig===AUTH.sig)return;AUTH.lbAt=now;AUTH.busyL=1;
    AUTH.db.doc('players/'+AUTH.id).set({...st,at:now}).then(()=>{AUTH.sig=sig}).catch(e=>{if(e&&e.code==='invalid_argument')AUTH.ro=true}).finally(()=>AUTH.busyL=0)}}
function subLB(){if(AUTH.unsub)return;const t=setTimeout(()=>{AUTH.slow=true;if(view==='rank')renderView()},10000);
  AUTH.unsub=AUTH.db.collection('players').orderBy('score','desc').limit(300).onSnapshot(snap=>{
    AUTH.players=snap.docs.map(d=>{const x=d.data()||{};return {...x,id:d.id}});if(!snap.metadata.fromCache){clearTimeout(t);AUTH.slow=false}if(view==='rank'||view==='me')renderView()},
    e=>{clearTimeout(t);AUTH.lbErr=e&&e.code||'err';if(view==='rank')renderView()})}

function myStats(){const L=Object.values(S.lands),ctrs=[...new Set(ownedCodes().map(cc))];
  const bld=L.reduce((a,l)=>a+l.tiles.filter(t=>t.b).length,0),lv=L.reduce((a,l)=>a+l.tiles.reduce((s,t)=>s+(t.b?t.b.lv:0),0),0);
  const cos=L.reduce((a,l)=>a+l.cos.filter(x=>x.own).length,0),pop=L.reduce((a,l)=>a+(l.pop||0),0);
  let bank=0;for(const A in S.accts)bank+=S.accts[A].bal/rate(curOf(A));
  const hap=L.length?L.reduce((a,l)=>a+(l.happy??.7),0)/L.length:0,nw=netWorth(),inc=RT.inc*60;
  const score=Math.round(Math.sqrt(Math.max(0,nw))*10+pop*.4+lv*35+ctrs.length*500+S.routes.length*150+cos*120+S.bp.length*250);
  return {nick:String(S.player.name||'').slice(0,24),av:S.player.av||'🧑‍💼',co:String(S.co||'').slice(0,40),home:S.home||ctrs[0]||'',nw:Math.round(nw),inc:Math.round(inc),pop:Math.round(pop),bld,lv,ctry:ctrs.length,plots:L.length,routes:S.routes.length,cos,subs:Object.keys(S.cos||{}).length,bank:Math.round(bank),gold:Math.round((S.gold?.oz||0)*100)/100,col:Math.round(S.collected||0),bp:S.bp.length,hap:Math.round(hap*100),ms:S.ms||0,t:Math.round(S.t),score}}

async function rxProcess(){if(!online()||!S||!S.started||!SO.rx||!SO.rx.length||SO.rxBusy)return;if(!S.rx)S.rx={};SO.rxBusy=1;let got0=0;
